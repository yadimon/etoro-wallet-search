<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eToro Wallet Search</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" width="36" height="36" alt="" />
      <div>
        <h1>Wallet Search</h1>
        <p id="version"></p>
      </div>
      <span class="badge">eToro</span>
    </header>
    <p id="status" role="status" aria-live="polite">…</p>
    <dl id="details" hidden>
      <div>
        <dt id="rows-label"></dt>
        <dd id="rows"></dd>
      </div>
      <div>
        <dt id="zone-label"></dt>
        <dd id="zone"></dd>
      </div>
      <div>
        <dt id="cache-label"></dt>
        <dd id="cache"></dd>
      </div>
    </dl>
    <section id="permission" hidden>
      <p id="permission-text" class="muted"></p>
      <p id="permission-origin"></p>
      <button id="allow" class="primary" type="button"></button>
    </section>
    <div class="actions">
      <button id="show" class="primary" type="button" hidden></button>
      <button id="remove" type="button" hidden></button>
      <button id="open" class="primary" type="button"></button>
      <button id="clear-cache" type="button" hidden></button>
    </div>
    <p id="memory" class="muted"></p>
    <footer><a id="help" href="help.html" target="_blank" rel="noopener"></a></footer>
  </body>
</html>
